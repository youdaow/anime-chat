<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover：不加这条，iOS Safari 的 env(safe-area-inset-*) 永远是 0，
     手机上的底部导航和发送键会被手势条压住（样式里靠它留白）。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>二次元聊天 AI · 会发表情包的那种</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌸</text></svg>">
<link rel="stylesheet" href="/web/style.css?v=4">
</head>
<body>
<!-- 三个页面 + 底部常驻选项卡：对话 / 联系人 / 我。桌面也这么摆，不再有左侧双栏。
     以前窄屏走「推入式导航」、宽屏走双栏侧边栏，两套状态在 JS 里缠成一团
     （isNarrow / show-chat / data-wide 互相踩）；换成选项卡后只剩一个判断：现在在哪一页。
     聊天页沿用 .main 那套样式，另外两页复用侧栏的列表样式。 -->
<div id="app" data-tab="chat">

  <!-- ------------------------------------------------------------ 对话 -->
  <!-- 微信式会话列表：一行一个人（头像 / 名字 / 最后一句 / 时间 / 未读）。
       点一行才进聊天，聊天是推入页（#page-thread），不是选项卡。 -->
  <main class="page page-chat on" id="page-chat">
    <header class="page-head">
      <h2>对话</h2>
      <span class="side-tools">
        <button id="btn-find-chat" title="挑一个人开聊">＋找人聊</button>
      </span>
    </header>
    <div class="page-scroll">
      <div id="chat-list" class="chat-list"></div>
      <p class="page-note">一行一个人。点进去就是聊天，左上角 ← 回到这里。</p>
    </div>
  </main>

  <!-- ------------------------------------------------ 聊天（推入页） -->
  <!-- 盖住底部选项卡（grid-row: 1 / -1），跟微信一样：聊天时看不见 tab。 -->
  <main class="main page push page-thread" id="page-thread" hidden>
    <header class="chat-head" id="chat-head">
      <button class="thread-back" id="btn-thread-back" title="回到对话列表" aria-label="回到对话列表">←</button>
      <!-- 头像点进去是这个人的名片（微信聊天头部点名字/头像也是进资料页） -->
      <button class="avatar-btn" id="head-avatar" title="看 TA 的名片"></button>
      <div class="head-info">
        <b id="head-name">—</b>
        <span id="head-title"></span>
      </div>
      <div class="head-chips" id="head-chips"></div>
      <div class="head-actions">
        <button id="btn-context" title="看看这次真正发给模型的内容">上下文</button>
        <button id="btn-compact" title="把较早的对话压缩成角色记忆">总结记忆</button>
        <button id="btn-del-conv" title="清空和 TA 的记录，从头再聊">从头再聊</button>
      </div>
      <!-- 手机上 .head-actions 那三个文字按钮排不进一行（360px 会横向溢出），
           换成一个 ⋯ 打开同样的动作；宽屏由样式 display:none 藏掉。 -->
      <button id="btn-head-menu" class="head-menu-btn" title="会话操作" aria-label="会话操作">⋯</button>
    </header>

    <div id="banner" class="banner" hidden></div>

    <div class="messages" id="messages"></div>
    <button id="btn-new-messages" class="new-messages" type="button" hidden aria-label="有新消息，回到底部">↓ 新消息</button>

    <footer class="composer" id="composer" hidden>
      <!-- 群聊专用：让 AI 之间自己接话，不用你每句都喂 -->
      <div class="group-bar" id="group-bar" hidden>
        <span class="group-who" id="group-who"></span>
        <button id="btn-ai-next" title="让下一个角色接上一句">让 TA 接话</button>
        <button id="btn-ai-loop" title="不用你插话，让她们自己聊几轮">自己聊几轮</button>
      </div>
      <div class="attach-row" id="attach-row" hidden></div>
      <div class="composer-row">
        <!-- 图标换成「贴纸卡」：原来两张 emoji 脸并排，分不出哪个是选表情、哪个是传图。
             SVG 用 currentColor，深浅主题都跟文字色走，不会像 emoji 那样在深色下发灰。 -->
        <button id="btn-pick" class="round" title="发表情包（挑一张甩出去）" aria-label="发表情包">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5V6.2A2.2 2.2 0 0 0 17.8 4H6.2A2.2 2.2 0 0 0 4 6.2v11.6A2.2 2.2 0 0 0 6.2 20h8.3z"/>
            <path d="M20 14.5h-3.9a1.8 1.8 0 0 0-1.8 1.8V20"/>
            <path d="M8.6 10.2h.01M13.4 10.2h.01"/>
            <path d="M8.9 13.6c.8.9 1.7 1.3 2.6 1.3s1.8-.4 2.6-1.3"/>
          </svg>
        </button>

        <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button id="btn-send" class="send" title="发送">发送</button>
      </div>
      <div class="composer-hint" id="composer-hint"></div>
      <div class="stream-status" id="live-status" hidden></div>
    </footer>
    <div class="picker" id="picker" hidden>
      <div class="picker-head">
        <input id="picker-q" type="search" placeholder="搜表情（标签：傲娇、加油、无语…）">
        <div class="picker-tabs" id="picker-tabs">
          <button data-tab="all" class="on">全部</button>
          <button data-tab="favorite">收藏</button>
          <button data-tab="builtin">内置</button>
          <button data-tab="user">我的</button>
          <button data-tab="web">联网搜索</button>
        </div>
        <button id="picker-close" class="close">×</button>
      </div>
      <div class="picker-emotions" id="picker-emotions"></div>
      <div class="picker-grid" id="picker-grid"></div>
      <div class="picker-foot" id="picker-foot"></div>
    </div>
  </main>

  <!-- ------------------------------------------------ 名片（推入页） -->
  <!-- 联系人点一个人先到这里（微信的通讯录就这样：先看名片，名片上按「发消息」）。
       编辑 / 复制 / 导出 / 隐藏 / 删除也都在这一页，列表行里不再摆 ⋯。 -->
  <main class="page push page-card" id="page-card" hidden>
    <header class="chat-head">
      <button class="thread-back" id="btn-card-back" title="回到联系人" aria-label="回到联系人">←</button>
      <div class="head-info"><b>名片</b></div>
    </header>
    <div class="page-scroll card-body" id="card-body"></div>
  </main>

  <!-- ----------------------------------------------------------- 联系人 -->
  <main class="page page-contacts" id="page-contacts" hidden>
    <header class="page-head">
      <h2>联系人</h2>
      <span class="side-tools">
        <button id="btn-new-char" title="新建角色">＋新建</button>
        <button id="btn-ai-char" title="输入角色名和出处，AI 自动生成角色卡并添加">AI 生成</button>
        <label class="file-btn" title="导入 JSON / PNG 角色卡">导入<input type="file" id="file-card" accept=".json,.png,.zip" hidden></label>
      </span>
    </header>
    <div class="side-search">
      <input id="side-q" type="search" placeholder="搜索角色" autocomplete="off">
    </div>
    <div class="page-scroll">
      <div id="char-list" class="char-list"></div>
      <p class="page-note">点一个人先看名片，名片上按「发消息」才开始聊；编辑 / 复制 / 导出 / 隐藏 / 删除也在名片上。</p>
    </div>
  </main>

  <!-- --------------------------------------------------------------- 我 -->
  <main class="page page-me" id="page-me" hidden>
    <header class="page-head">
      <h2>我</h2>
      <span class="side-tools">
        <button id="btn-theme" class="theme-btn" title="切换深浅色">☾</button>
        <button id="btn-sfx" class="icon-btn" title="发送 / 收到消息的音效开关">🔊</button>
      </span>
    </header>
    <div class="page-scroll">
      <!-- 设置整块内嵌在这里，第一组就是「我是谁」（头像 / 名字 / 补充设定）。
           以前它是「设置」弹窗，现在这一页就是设置。 -->
      <section id="settings-host"><div class="loading">加载设置…</div></section>
      <div class="row-actions">
        <button id="btn-about" class="plain">关于与自检</button>
      </div>
    </div>
  </main>

  <!-- ------------------------------------------------------------- 导航 -->
  <nav class="tabbar" id="tabbar">
    <button type="button" data-tab="chat" class="on">对话<span class="tab-badge" id="tab-unread" hidden></span></button>
    <button type="button" data-tab="contacts">联系人</button>
    <button type="button" data-tab="me">我</button>
  </nav>
</div>

<div class="modal-root" id="modal-root" hidden>
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal" id="modal"><div class="modal-body" id="modal-body"></div></div>
</div>
<div id="toast-root" class="toast-root"></div>
<noscript>这个界面需要 JavaScript。</noscript>
<script type="module" src="/web/app.js"></script>
</body>
</html>
